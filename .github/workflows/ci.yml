name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-lock.txt pytest
      - run: python -m pytest
      - run: python -m pip check
      - run: python scripts/build_agent.py && python scripts/check_agent_bundle.py
      - run: bash -n install.sh && bash -n scripts/install-agent.sh && bash -n scripts/uninstall-agent.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Check installer on Debian 13 without modifying the host
        run: docker run --rm -v "$PWD/install.sh:/install.sh:ro" debian:13 bash /install.sh --port 18080 --bind 127.0.0.1 --check
      - name: Build frontend, server and Agent image
        run: docker build -t traffic-sentinel:ci .
      - name: Smoke test the container and its persistent data
        run: python3 scripts/smoke_container.py traffic-sentinel:ci
      - name: Install and upgrade Agent as its real service account
        run: docker run --rm --user 0 --entrypoint python -v "$PWD/scripts/check_agent_install.py:/check_agent_install.py:ro" traffic-sentinel:ci /check_agent_install.py
