[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-sentinel"
version = "0.1.6"
description = "Self-hosted VPS traffic accounting and Telegram reporting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.28,<1",
  "psutil>=7,<9", "cryptography>=44", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.50", "Pillow>=11"]

[project.scripts]
sentinel-server = "sentinel.server:main"
sentinel-agent = "sentinel.agent:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
